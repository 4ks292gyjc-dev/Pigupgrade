<style>
/* Layout: full-screen 3D barn forge; HUD top (day/tribute), station panel bottom */
:root{
  --bg:#120d0a; --panel:rgba(28,20,15,.88); --line:#4a3a2c; --text:#f6ead8; --muted:#b29e88; --ember:#ff8a3d;

}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{touch-action:manipulation}
#gl{touch-action:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.hud{position:fixed;left:0;right:0;z-index:2;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#top,#bottom{max-width:520px;margin-inline:auto}
#top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));display:grid;gap:6px}
#bottom{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:11px;color:var(--muted);letter-spacing:.05em}
.big{font-family:var(--display);font-size:20px}
.gold{color:var(--great)} .bad{color:var(--break)}
.anger span{font-family:var(--display);font-size:16px;opacity:.25} .anger span.on{opacity:1;color:var(--break)}
#panel{max-height:46vh;overflow:auto;display:grid;gap:8px}
#panel p{margin:0}
#nav{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:center}
#nav b{font-family:var(--display);font-weight:400;font-size:18px;text-align:center;text-shadow:0 2px 4px #000}
button{font-family:var(--display);font-size:16px;border:0;border-radius:10px;padding:10px;cursor:pointer;color:#1a120c;background:var(--text);min-height:44px}
button small{display:block;font-family:var(--body);font-size:11px;opacity:.75}
button:focus-visible{outline:3px solid var(--great);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
button.hot{background:linear-gradient(180deg,#ffb06b,var(--ember))}
button.armed{outline:3px solid var(--great)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns>button{flex:1 1 30%}
#strike{font-size:24px;flex-basis:100%;min-height:58px}
.odds{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:2px}
.odds span{font-size:11px;color:var(--muted)} .odds b{display:block;font-size:14px;font-weight:400}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)} .stack i{display:block;height:100%}
.charges{display:grid;grid-template-columns:repeat(10,1fr);gap:3px} .charges i{height:8px;border-radius:2px;background:var(--line)} .charges i.on{background:var(--frenzy)}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:rgba(255,255,255,.04);border-radius:10px;padding:6px 8px;text-align:left}
.item p{margin:0;font-size:12px;color:var(--muted)}
.item b{font-family:var(--display);font-weight:400;font-size:15px}
.tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--text);margin-left:4px}
#banner{position:fixed;left:50%;top:32%;z-index:5;text-align:center;pointer-events:none;opacity:0;width:100%;transform:translate(-50%,-50%)}
#banner.show{animation:bIn .45s cubic-bezier(.2,1.6,.4,1) forwards,bOut .4s ease-in 1.8s forwards}
@keyframes bOut{to{opacity:0}}
#banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(48px,16vw,110px);line-height:1;text-shadow:0 0 28px currentColor,0 5px 0 #000}
#banner small{display:block;font-size:17px;color:var(--text);text-shadow:0 2px 4px #000;margin-top:6px}
#banner.g b{color:var(--great);animation:hue 1s linear infinite} #banner.s b{color:var(--ok)} #banner.h b{color:var(--hold)} #banner.d b{color:var(--dmg)}
#banner.b b,#banner.fake b{color:var(--break);animation:jit .07s infinite} #banner.f b{color:var(--frenzy)}
@keyframes bIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes jit{25%{transform:translate(-4px,2px) skewX(8deg)}75%{transform:translate(4px,-2px) skewX(-8deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#ring{position:fixed;left:50%;top:40%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:3;pointer-events:none;

#ringText{position:fixed;left:50%;top:calc(40% + min(35vw,150px) + 18px);transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:22px;color:var(--great);pointer-events:none;white-space:nowrap;text-shadow:0 2px 4px #000}
#frenzyBar{position:fixed;left:0;right:0;top:0;height:5px;background:var(--frenzy);transform-origin:left;z-index:6;box-shadow:0 0 16px var(--frenzy)}
.modal{position:fixed;inset:0;background:rgba(10,7,5,.92);display:grid;place-items:center;padding:20px;z-index:8}
.modal>div{display:grid;gap:10px;max-width:380px;width:100%;text-align:center}
.modal h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.modal p{margin:0;color:var(--muted)}

<script>

const BREAK = [0,1.8,5.9,12.9,24.8,29.7,34.7,38.3,41.8,44.3,46.7,49.1,50.5,51.9,53.2,54.5,55.8,57.6,59.4,61.2,63,63.9,64.8,65.7,66.6,67.5,68.4,69.3,70.2,71.1,72];
const QP = [[1,1800],[7,7500],[14,45800],[21,232000]];
// shortcut: only 4 tribute points are published; days between are geometric interpolation, replace with the real calendar if found
function quota(d) {
  let q;
  if (d >= 21) q = 232000 * 1.2 ** (d - 21);
  else { const i = QP.findIndex(([x]) => x > d) - 1, [d0, q0] = QP[i], [d1, q1] = QP[i + 1]; q = q0 * (q1 / q0) ** ((d - d0) / (d1 - d0)); }
  return Math.round(q * (has("rebate") ? .9 : 1) / 10) * 10;
}
const NAMES = ["아기돼지","꿀꿀이","통통돼지","분홍돼지","흙돼지","씨름돼지","근육돼지","철갑돼지","은빛돼지","금빛돼지",

const pname = L => L > 20 ? `돼지신 ${"★".repeat(Math.min(5, L - 20))}` : NAMES[L];
const HSL = [[350,80,82],[350,75,78],[345,70,74],[340,70,70],[25,35,55],[20,55,60],[10,65,58],[210,10,62],[210,15,80],[45,85,60],
  [48,95,65],[5,70,50],[150,55,45],[55,100,60],[20,100,55],[195,80,75],[0,90,65],[45,60,92],[250,60,35],[280,70,55],[50,100,96]];

  ["sieve","잿빛 체","파괴",2,1,"파괴될 때 +500G"],

  ["hbell","머리 없는 종","광란",6,2,"광란이 끝날 때 +1강"],["collar","방울 목줄","광란",6,2,"광란 중 타격마다 가치 +5%"],["redsand","붉은 모래시계","광란",6,2,"광란 +1초"],
  ["core","완벽한 마나 핵","걸작",7,4,"광란 중 대성공 티켓 +6",0,1],["wick","꺼지지 않는 심지","광란",8,4,"광란 +2초"],
  ["pouch","숯 주머니","가치",2,1,"기본 가치 +80G"],["signet","쇠 인장","가치",2,1,"가치 +15%"],["iron","검은 쇳돌","가치",5,2,"+8 이상에서 가치 +30%"],

// ===== Sound: pooled <audio> so rapid hits overlap; mute is remembered =====
const sfx = (() => {
  let muted = false; try { muted = localStorage.getItem("pigforge-mute") === "1"; } catch {}
  const pool = {};
  return {
    play(...ids) { if (muted || !window.SFX_DATA) return;
      for (const id of ids) { const src = SFX_DATA[id]; if (!src) continue; const list = pool[id] ||= [];
        let a = list.find(x => x.paused || x.ended); if (!a) { a = list.length < 4 ? new Audio(src) : list[0]; if (!list.includes(a)) list.push(a); }
        a.volume = Math.min(1, (SFX_VOL[id] ?? .4) * 1.2); try { a.currentTime = 0; } catch {} a.play().catch(() => {}); } },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("pigforge-mute", muted ? "1" : "0"); } catch {} },
  };
})();

// Pig families: six regular lines (picked at delivery) and three special lines sold by the merchant.

// ===== Forge odds: 30-ticket deck (B9 D2 H5 S12 G2); the break pile is weighted by grade =====
let frenzyUntil = 0;
const inFrenzy = () => performance.now() < frenzyUntil;
function odds(p, frenzy = inFrenzy(), armed = S.armed) {
  const c = { d: 2, h: 5, s: 12, g: 2 }; let bt = 9;
  const add = (k, n) => c[k] += n;
  if (has("bent")) add("s", 4); if (has("spike")) add("s", 6); if (has("whet")) { add("h", -2); add("s", 2); } if (has("mallet")) { add("d", -1); add("s", 1); }
  if (has("coal")) add("g", 1); if (has("gnail")) add("g", 2); if (has("die")) add("g", 4); if (has("seal")) add("h", 2); if (has("weight")) add("h", 3);
  if (has("core") && frenzy) add("g", 6); if (has("hoop")) bt -= 2; if (has("seed")) add("h", 6); if (has("pearl")) add("d", 3);
  for (const k in c) c[k] = Math.max(0, c[k]);
  if (armed.chalk) c.g *= 2;
  const N = c.d + c.h + c.s + c.g, B = BREAK[Math.min(30, p.lvl)] / 100;
  let pb = 0;
  if (!frenzy && B > 0) {
    const W = 21 * B / (1 - B) * (bt / 9); pb = W / (W + N);
    pb *= (has("bknot") ? .9 : 1) * (has("tongs") && p.lvl >= 6 ? .75 : 1) * p.nbm * (1 - p.splice) * (1 - p.scorch);
  }
  const r = 1 - pb;
  return { b: pb, d: c.d / N * r, h: c.h / N * r, s: c.s / N * r, g: c.g / N * r };
}

}

function rollOutcome(o) { let r = Math.random(); for (const k of ["b","d","h","s","g"]) if ((r -= o[k]) < 0) return k; return "s"; }

// One strike: mutates the pig and state, returns the outcome
function strike(p) {
  let frenzyStarted = false;
  if (!inFrenzy() && p.charge >= 10) { p.charge = 0; frenzyUntil = performance.now() + (4 + (has("redsand") ? 1 : 0) + (has("wick") ? 2 : 0)) * 1000; frenzyStarted = true; }
  const fz = inFrenzy(), o = odds(p, fz), A = S.armed; S.armed = {};
  let res = rollOutcome(o), saved = "";
  if (A.powder) res = res === "s" || res === "g" ? "g" : "b";
  p.nbm = 1;
  if (res === "b" && A.scale) { res = "h"; saved = "철 비늘이 막았다"; }
  if (res === "b" && has("fence") && !S.fenceUsed) { S.fenceUsed = true; res = "d"; saved = "철사 울타리가 막았다"; }
  if (res === "b" && has("stone") && !p.stone) { p.stone = true; res = "d"; saved = "굳센 주춧돌이 막았다"; }
  if (res === "b" && has("phoenix") && !p.phoenix) { p.phoenix = true; p.mult *= .6; res = "h"; saved = "불사조 재 (가치 -40%)"; }
  if (res === "b") {
    if (has("sieve")) S.gold += 500;
    if (has("dawn")) S.inherit = Math.floor(p.lvl * .4);
    if (has("ledger") && p.lvl >= 7 && (S.ledgerToday || 0) < 2) { S.ledgerToday = (S.ledgerToday || 0) + 1; S.extra++; }
    return { res, frenzyStarted };
  }
  const first = p.strikes === 0, up = res === "s" || res === "g";
  if (res === "g") { p.lvl += 2; p.mult *= 2.5 / 2.25; }
  if (res === "s") p.lvl += 1;
  if (res === "d" && p.lvl > 0) { if (has("pearl") && p.pearl < 2) p.pearl++; else { p.lvl -= 1; if (has("crown")) p.mult *= 1.25; } }
  if (up) {
    p.run++; p.holdRun = 0;
    if (has("stamp")) p.flat += 100;
    if (has("brand") && first) p.lvl += 2;
    if (p.run % 2 === 0) { if (has("knot2")) p.mult *= 1.1; if (has("hand3")) p.lvl += 1; }
    if (has("scorch") && !fz) p.scorch = Math.min(.18, p.scorch + .03);
    if (has("echo") && Math.random() < .25) p.lvl += 1;
    if (has("lheart") && p.lvl >= 7) p.mult *= 1.15;
  } else p.run = 0;
  if (res === "s" && has("cog")) p.base += 30;
  if (res === "s" && has("shaft") && ++p.sCount % 2 === 0) p.lvl += 1;
  if (res === "g") {
    if (has("cbell")) p.mult *= 1.2;
    if (!fz && has("lmark")) p.nbm *= .6;
    if (!fz && has("fork")) p.lvl += 1;
    if (fz && has("glass")) p.lvl += 3;
    if (has("heart")) { p.lvl += p.heart; p.heart = 0; }
  }
  if (res === "h") {
    p.holdRun++;
    if (has("seal") && p.holdRun % 2 === 0) p.lvl += 1;
    if (has("paper")) p.flat += 180; if (has("tea")) p.mult *= 1.06; if (has("seed")) p.base += 40;
    if (has("sleep") && Math.random() < .7) p.lvl += 1;
    if (has("thread")) p.nbm *= .8;
    if (has("heart")) p.heart = Math.min(4, p.heart + 1);
  } else if (!up) p.holdRun = 0;
  if (res === "d") {
    if (has("apron")) p.flat += 140; if (has("splice")) p.splice = Math.min(.6, p.splice + .15);
    if (has("oath") && Math.random() < .7) p.lvl += 1; if (has("watch") && !fz) p.charge++;
  }
  if (fz && has("collar")) p.mult *= 1.05;
  if (!fz) { p.charge++; if (first && has("locket")) p.charge += 2; }
  p.charge = Math.min(10, p.charge); p.strikes++; p.peak = Math.max(p.peak || 0, p.lvl);
  let twin = false, mastered = null;
  if (has("twins") && Math.random() < .02) { S.pen.push({ ...JSON.parse(JSON.stringify(p)), id: uid++ }); twin = true; }
  if (p.lvl >= 20 && unlock(p.fam)) mastered = p.fam;
  return { res, frenzyStarted, saved, twin, mastered };
}

function morning() {
  const n = 3 + (has("permit") ? 1 : 0) + S.extra; S.extra = 0;
  for (let i = 0; i < n; i++) S.pen.push(newPig());
  S.fenceUsed = false; S.freeReroll = has("voucher"); S.armed = {}; S.ledgerToday = 0;
  S.shop = S.day >= 2 ? rollShop() : [];
  S.merchant = S.day % 3 === 0 ? makeMerchant() : null;
}
function rollShop() {
  return RELICS.filter(r => r.day <= S.day && !S.relics.includes(r.id) && (!r.mw || unlocks.some(k => FAMS[k].mw === r.id))).sort(() => Math.random() - .5).slice(0, 3).map(r => r.id);
}
function makeMerchant() {
  const v = S.day / 3, q = quota(S.day), stock = { pig: { left: [2,3,3,4,4,4,4][v - 1] ?? 5, price: Math.max(700, Math.round(.4 * q / 10) * 10) } };
  const g = S.day < 9 ? 0 : S.day < 15 ? 2 : 4; // special pig grade by day; price ×1.6 / ×2.4 for +2 / +4 matches the source table
  stock.special = { left: 1, fam: SPECIAL[Math.floor(Math.random() * 3)], lvl: g, price: Math.max(1100, Math.round(1.75 * .65 * q * [1, 1.6, 2.4][g / 2] / 10) * 10) };
  for (const [id, it] of Object.entries(ITEMS)) {

    stock[id] = { left: it.stock, price: Math.round(it.k * q / 10) * 10 };

}
function ringBell() {
  const q = quota(S.day), total = S.tribute.reduce((a, p) => a + V(p), 0), day = S.day;
  const short = Math.max(0, q - total), fromGold = Math.min(S.gold, short), paid = fromGold >= short;
  const change = Math.max(0, total - q); // only the pig value above the tribute comes back as gold
  S.gold += change - fromGold; S.tribute = [];
  if (paid) { S.pays++; if (has("tally")) S.credits++; } else S.anger++;

  const col = F?.special ? new THREE.Color().setHSL(F.hue / 360, .55, Math.min(.72, .4 + L * .016)) : new THREE.Color().setHSL(h / 360, s / 100, l / 100);
  const g = new THREE.Group(), metal = L >= 7;
  const mat = new THREE.MeshStandardMaterial({ color: col, metalness: metal ? .75 : .05, roughness: metal ? .28 : .65,
    emissive: p.heated ? 0xff5a10 : L >= 13 ? col : 0x000000, emissiveIntensity: p.heated ? .45 : L >= 13 ? .25 : 0 });
  const dark = new THREE.MeshStandardMaterial({ color: col.clone().multiplyScalar(.7), metalness: mat.metalness, roughness: mat.roughness });
  const add = (geo, m, x, y, z, sx = 1, sy = 1, sz = 1) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); g.add(o); return o; };

  add(new THREE.CylinderGeometry(.15, .15, .14, 16), dark, .96, .66, 0).rotation.z = Math.PI / 2;
  for (const z of [-.06, .06]) add(new THREE.SphereGeometry(.035, 8, 6), new THREE.MeshBasicMaterial({ color: 0x220000 }), 1.03, .67, z);
  const eyeM = new THREE.MeshBasicMaterial({ color: L >= 12 ? 0xffd43b : L >= 7 ? 0xff4a4a : 0x111111 });
  for (const z of [-.15, .15]) add(new THREE.SphereGeometry(.05, 10, 8), eyeM, .88, .84, z);
  for (const z of [-.18, .18]) add(new THREE.ConeGeometry(.11, .22, 4), dark, .55, 1.08, z).rotation.x = z > 0 ? .4 : -.4;
  for (const [x, z] of [[-.35, -.25], [-.35, .25], [.35, -.25], [.35, .25]]) add(new THREE.CylinderGeometry(.08, .07, .3, 10), dark, x, .15, z);
  add(new THREE.TorusGeometry(.08, .025, 6, 12, 5), dark, -.68, .7, 0).rotation.y = Math.PI / 2;
  if (p.fam === "tree") for (const [x, z, r] of [[-.2, -.15, .5], [0, .1, -.3], [.2, -.05, .2]]) { const leaf = add(new THREE.ConeGeometry(.09, .32, 5), new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: .6 }), x, 1.1, z); leaf.rotation.set(r, 0, r); }
  if (p.fam === "fish") add(new THREE.ConeGeometry(.22, .4, 3), new THREE.MeshStandardMaterial({ color: 0x2ec4b6, metalness: .4, roughness: .3 }), -.1, 1.1, 0, .4, 1, 1.4);
  if (p.fam === "grave") { g.userData.wisp = add(new THREE.SphereGeometry(.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xb98cff }), .1, 1.45, .25); }
  if (L >= 5 && L <= 9) add(new THREE.TorusGeometry(.5, .04, 8, 24), new THREE.MeshStandardMaterial({ color: 0xcfd3d8, metalness: .9, roughness: .2 }), 0, .55, 0, 1, 1, 1.3).rotation.y = Math.PI / 2;
  if (L >= 10) {
    const gold = new THREE.MeshStandardMaterial({ color: 0xffd43b, metalness: 1, roughness: .2, emissive: 0x6a4a00 });
    add(new THREE.CylinderGeometry(.2, .2, .1, 16, 1, true), gold, .6, 1.12, 0);
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; add(new THREE.ConeGeometry(.05, .16, 6), gold, .6 + Math.cos(a) * .19, 1.24, Math.sin(a) * .19); }
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: AURA, color: col, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
    sp.scale.set(2.6, 2.6, 1); sp.position.y = .6; g.add(sp); g.userData.aura = sp;
  }

    const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.quadraticCurveTo(.3, .7, .9, .8); sh.quadraticCurveTo(.6, .45, .75, .2); sh.quadraticCurveTo(.4, .15, 0, 0);
    const w = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({ color: L >= 18 ? 0xc4b5ff : 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: .92 }));
    const pivot = new THREE.Group(); pivot.position.set(0, .85, side * .3); w.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; pivot.add(w); g.add(pivot); pivot.userData.side = side; return pivot; });
  if (L >= 18) { const pts = new THREE.BufferGeometry(), arr = [];
    for (let i = 0; i < 60; i++) { const a = Math.random() * 7, r = .8 + Math.random() * .6; arr.push(Math.cos(a) * r, .2 + Math.random() * 1.4, Math.sin(a) * r); }
    pts.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3)); g.userData.stars = new THREE.Points(pts, new THREE.PointsMaterial({ color: 0xffffff, size: .05 })); g.add(g.userData.stars); }
  if (L >= 20) add(new THREE.TorusGeometry(.28, .03, 8, 30), new THREE.MeshBasicMaterial({ color: 0xfff6b0 }), .5, 1.55, 0).rotation.x = Math.PI / 2;
  g.userData.rainbow = L === 16 || L >= 20 ? mat : null;
  g.userData.mat = mat;
  return g;
}
function tickPig(g, t) {
  const u = g.userData;
  if (u.aura) u.aura.material.opacity = .4 + .2 * Math.sin(t * 3);
  if (u.wings) for (const w of u.wings) w.rotation.x = Math.sin(t * 7) * .35 * w.userData.side;
  if (u.stars) u.stars.rotation.y = t * .6;
  if (u.rainbow) u.rainbow.color.setHSL((t * .25) % 1, .9, .62);
  if (u.wisp) u.wisp.position.y = 1.45 + Math.sin(t * 3) * .08;
}

// Keep the 3D pigs in sync with state
const slots = new Map();
function placePig(key, p, parent, pos, scale) {
  const o0 = slots.get(key);
  if (!p) { if (o0) { o0.group.parent.remove(o0.group); slots.delete(key); } return; }
  const sig = `${p.id}:${p.lvl}:${p.peak}:${p.heated}`; let o = o0;
  if (!o || o.sig !== sig) { if (o) o.group.parent.remove(o.group); o = { sig, group: makePig(p) }; slots.set(key, o); parent.add(o.group); }
  o.group.position.copy(pos); o.group.scale.setScalar(scale);
  o.group.rotation.y = parent === scene ? Math.atan2(pos.z, -pos.x) : -Math.PI / 2; // turn the snout toward the viewer
}
let hideAnvilPig = false;
function sync() {
  const used = new Set(["anvil", "hand"]);
  placePig("anvil", hideAnvilPig ? null : S.anvil, scene, anvilPos.clone().setY(.72), .32);
  placePig("hand", S.hand, cam, new THREE.Vector3(.3, .2, -.9), .12);
  S.pen.slice(0, 12).forEach((p, i) => { const k = "pen" + i; used.add(k); placePig(k, p, scene, at(110 + (i % 4 - 1.5) * 8, 2.15 + Math.floor(i / 4) * .45, 0), .25); });
  S.tribute.slice(0, 8).forEach((p, i) => { const k = "tr" + i; used.add(k); placePig(k, p, scene, at(-70 + (i % 4 - 1.5) * 7, 2.85 + Math.floor(i / 4) * .3, .55), .19); });
  for (const k of [...slots.keys()]) if (!used.has(k)) placePig(k, null);
  ghost.visible = !!S.merchant;
}

// Effects
const shards = [], sparks = [], sparkGeo = new THREE.SphereGeometry(.02, 4, 3), shardGeo = new THREE.TetrahedronGeometry(.07);
function shatter(pos, color) {
  for (let i = 0; i < 46; i++) {
    const m = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({ color, metalness: .5, roughness: .4, transparent: true }));
    m.position.copy(pos).add(new THREE.Vector3((Math.random() - .5) * .4, Math.random() * .4, (Math.random() - .5) * .4));
    m.userData = { v: new THREE.Vector3((Math.random() - .5) * 4, 1.5 + Math.random() * 3, (Math.random() - .5) * 4), r: new THREE.Vector3(Math.random() * 10, Math.random() * 10, 0), life: 1.6 };
    m.scale.setScalar(.6 + Math.random() * 1.4); scene.add(m); shards.push(m);
  }
}
function sparkBurst(pos, color, n = 40) {
  for (let i = 0; i < n; i++) { const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: color === "rainbow" ? new THREE.Color().setHSL(Math.random(), 1, .6) : color, transparent: true }));
    m.position.copy(pos); m.userData = { v: new THREE.Vector3((Math.random() - .5) * 5, Math.random() * 4, (Math.random() - .5) * 5), life: .9 }; scene.add(m); sparks.push(m); }
}

// Camera: one view per station; swipe or arrows to turn, tap the scene at the anvil to strike
let st = 0, yaw = 0, pitch = -.5, shakeT = 0, swing = 0, fovTarget = 62, crackT = 0, drag = null;
canvas.addEventListener("pointerdown", e => drag = { x: e.clientX });
canvas.addEventListener("pointerup", e => {
  if (!drag) return; const dx = e.clientX - drag.x; drag = null;
  if (Math.abs(dx) > 50) go(dx > 0 ? -1 : 1);
  else if (STATIONS[st].id === "anvil" && S.anvil) doStrike();
});
addEventListener("keydown", e => { if (e.code === "Space" && STATIONS[st].id === "anvil") { e.preventDefault(); doStrike(); } if (e.code === "ArrowLeft") go(-1); if (e.code === "ArrowRight") go(1); });
// ▶ turns right (yaw decreases); swipe right turns left
function go(d) { st = (st - d + STATIONS.length) % STATIONS.length; confirmBell = false; ui(); }

let last = performance.now(), wasFrenzy = false;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  let target = STATIONS[st].yaw; while (target - yaw > 180) target -= 360; while (target - yaw < -180) target += 360;
  yaw += (target - yaw) * Math.min(1, dt * 7);
  pitch += (STATIONS[st].pitch - pitch) * Math.min(1, dt * 7);
  cam.position.set(0, 1.55, 0);
  if (shakeT > 0) { shakeT -= dt; cam.position.x += (Math.random() - .5) * .08; cam.position.y += (Math.random() - .5) * .08; }
  cam.rotation.set(0, 0, 0); cam.rotateY(yaw * Math.PI / 180); cam.rotateX(pitch);
  cam.fov += (fovTarget - cam.fov) * Math.min(1, dt * 4); cam.updateProjectionMatrix();
  fireLight.intensity = 2 + Math.sin(t * 13) * .3 + Math.random() * .3; fire.material.color.setHSL(.07 + Math.random() * .02, 1, .55);
  ghost.position.y = .2 + Math.sin(t * 2) * .06;
  for (const e of hatch.userData.eyes) e.scale.setScalar(S.anger ? 1 + S.anger * .35 + Math.sin(t * 8) * .1 : .7);
  for (const c of bank.children) if (c.userData.orb !== undefined) c.position.y = -.15 + Math.sin(t * 3 + c.userData.orb) * .03;
  swing = Math.max(0, swing - dt * 4); hammer.rotation.z = HAMMER_UP * (1 - Math.sin(swing * Math.PI));
  for (const [, o] of slots) tickPig(o.group, t);
  const ap = slots.get("anvil")?.group;
  if (ap && crackT > 0) { crackT -= dt; ap.position.x += (Math.random() - .5) * .03; ap.userData.mat.emissive.setHex(Math.random() < .5 ? 0xffffff : 0x000000); ap.userData.mat.emissiveIntensity = .8; }
  for (let i = shards.length - 1; i >= 0; i--) { const m = shards[i], u = m.userData; u.v.y -= 9.8 * dt; m.position.addScaledVector(u.v, dt);
    if (m.position.y < .03) { m.position.y = .03; u.v.multiplyScalar(.4); u.v.y *= -.5; }
    m.rotation.x += u.r.x * dt; m.rotation.y += u.r.y * dt; u.life -= dt; m.material.opacity = Math.min(1, u.life);
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); shards.splice(i, 1); } }
  for (let i = sparks.length - 1; i >= 0; i--) { const m = sparks[i], u = m.userData; u.v.y -= 6 * dt; m.position.addScaledVector(u.v, dt); u.life -= dt; m.material.opacity = u.life;
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); sparks.splice(i, 1); } }
  const fz = inFrenzy();
  $("frenzyBar").hidden = !fz;
  if (fz) $("frenzyBar").style.transform = `scaleX(${(frenzyUntil - now) / 7000})`;
  if (wasFrenzy && !fz) { if (has("hbell") && S.anvil) { S.anvil.lvl++; banner("+1강", "머리 없는 종", "s"); sfx.play("xp-up"); } ui(); }
  wasFrenzy = fz;
  R.render(scene, cam);
  requestAnimationFrame(loop);
}

// ===== Strike flow =====
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false, nextStrikeAt = 0, lastSnap = null;
function banner(main, sub = "", cls = "") { const b = $("banner"); b.className = ""; void b.offsetWidth; b.querySelector("b").textContent = main; b.querySelector("small").textContent = sub; b.className = "show " + cls; }
function flash(a = .9) { const f = $("flash"); f.style.transition = "none"; f.style.opacity = a; requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = "opacity .6s"; f.style.opacity = 0; })); }

async function doStrike() {
  const p = S.anvil, now = performance.now();
  if (!p || busy || now < nextStrikeAt) return;
  if (!p.heated) return banner("차갑다", "화로에서 먼저 달구세요", "h");
  const big = p.lvl >= 15 && !inFrenzy() && p.charge < 10, before = p.lvl, pos = anvilPos.clone().setY(.9);
  busy = true; lastSnap = { pig: JSON.parse(JSON.stringify(p)), armed: { ...S.armed }, fence: S.fenceUsed, gold: S.gold };
  ui();
  if (big) { // FIFA-style build-up from +15
    fovTarget = 32; $("ring").hidden = $("ringText").hidden = false; sfx.play("whoosh-short");
    const dur = reduced ? 700 : 2400, t0 = performance.now();
    for (let k = 0; k < 1; k = (performance.now() - t0) / dur) {
      $("ring").style.setProperty("--p", k); $("ringText").textContent = `+${before} ▶ +${before + 1}   ${(dur / 1000 * (1 - k)).toFixed(1)}s`;
      if (k > .7) shakeT = .05; await sleep(30);
    }
    $("ring").hidden = $("ringText").hidden = true; flash(.8);
  }
  swing = 1; await sleep(big ? 60 : 110);
  const fzBefore = inFrenzy(), { res, frenzyStarted, saved, twin, mastered } = strike(p);
  sfx.play("click-deep"); buzz(res === "b" ? 0 : res === "g" ? [30, 40, 60] : 25);
  nextStrikeAt = performance.now() + (fzBefore || frenzyStarted || !has("loop") ? 560 : 560 / 1.2);
  if (res === "b") await breakFx(p, before, big);
  else {
    if (res === "g") { sparkBurst(pos, "rainbow", 90); flash(.5); banner("대성공!!", `+${before} → +${p.lvl} ${pigName(p)}`, "g"); sfx.play("level-up"); }
    if (res === "s") { sparkBurst(pos, 0xffd43b, 40); banner("성공", `+${p.lvl} ${pigName(p)}`, "s"); sfx.play("xp-up"); }
    if (res === "h") { banner("유지", saved || "아무 일도 없었다", "h"); sfx.play("tap-ui-tick"); }
    if (res === "d") { shakeT = .25; crackT = .2; banner("손상", saved || `+${before} → +${p.lvl}`, "d"); sfx.play("error-soft-thud"); }
    if (twin) setTimeout(() => { banner("쌍둥이!", "똑같은 돼지가 우리에 생겼어요", "f"); sfx.play("coin-double"); }, 400);
    if (mastered) setTimeout(() => { banner("걸작 해금!", `${RB[FAMS[mastered].mw].name} · 이제 유물 진열장에 나와요`, "g"); sfx.play("achievement"); }, 900);
    if (frenzyStarted) setTimeout(() => { banner("광란!", "잠깐 동안 깨지지 않아요", "f"); sfx.play("achievement"); }, 350);
    if (big) { await sleep(700); fovTarget = 62; }
  }
  busy = false; ui();
}
async function breakFx(p, before, big) {
  const pos = anvilPos.clone().setY(.9), color = new THREE.Color().setHSL(HSL[Math.min(20, before)][0] / 360, .6, .6);
  if (Math.random() < .5) { // pretends to succeed, then breaks
    p.lvl = before + 1; ui(); sparkBurst(pos, 0x4dabf7, 40); banner("성공!", `+${p.lvl} ${pigName(p)}`, "s"); sfx.play("success-warm-chime");
    await sleep(reduced ? 400 : 1000); banner("…은 구라", "", "fake"); await sleep(350);
  }
  shakeT = .6; crackT = .65; sfx.play("invalid-thunk"); await sleep(650);
  hideAnvilPig = true; S.anvil = null; sync(); shatter(pos, color); sparkBurst(pos, 0xffffff, 50); flash(1); shakeT = .5; sfx.play("trash-crumple", "error-sharp-alert"); buzz([80, 40, 160]);
  banner("파사삭", `+${before} ${pigName(p, before)} 파괴`, "b"); ui();
  await sleep(big ? 1300 : 900); hideAnvilPig = false; fovTarget = 62;
}

// ===== HUD =====

const pct = x => (x * 100).toFixed(1) + "%";

    h += `<div class="row"><span>돼지 1마리 = 크레딧 1</span><button id="feed" ${S.hand ? "" : "disabled"}>손에 든 돼지 넣기</button></div>`;
    if (S.shop.length) h += `<div class="list">${S.shop.map(id => { const r = RB[id]; return `<div class="item"><div><b>${r.name}</b><span class="tag">${r.cat}</span><p>${r.desc}</p></div><button data-buy="${id}" ${S.credits < r.cost || S.relics.length >= 8 ? "disabled" : ""}>${r.cost}크레딧</button></div>`; }).join("")}</div>`;
    else if (S.day >= 2) h += `<p class="label">오늘 진열장이 비었어요.</p>`; else h += `<p class="label">진열장은 Day 2부터 열려요.</p>`;
    if (S.day >= 2) h += `<button class="ghost" id="reroll" ${S.freeReroll || S.gold >= rerollCost() ? "" : "disabled"}>진열장 바꾸기 · ${S.freeReroll ? "무료" : G(rerollCost())}</button>`;
    h += `<details><summary class="label">걸작 해금 ${unlocks.length}/9 · 계열 돼지를 +20까지 만들면 해금</summary><div class="list" style="margin-top:6px">${Object.entries(FAMS).map(([k, f]) =>
      `<div class="item"><div><b>${unlocked(k) ? RB[f.mw].name : "???"}</b><span class="tag">${f.name}${f.special ? " · 특수" : ""}</span><p>${unlocked(k) ? RB[f.mw].desc : `${f.name} 돼지 +20 달성 시 해금`}</p></div><span class="label">${unlocked(k) ? "해금" : "잠김"}</span></div>`).join("")}</div></details>`;
    h += `<p class="label">내 유물 ${S.relics.length}/8</p>` + (S.relics.length ? `<div class="list">${S.relics.map(id => `<div class="item"><div><b>${RB[id].name}</b><p>${RB[id].desc}</p></div><button class="ghost" data-toss="${id}">버리기</button></div>`).join("")}</div>` : "");
  }
  if (s === "ghost") {
    if (!S.merchant) h += `<p class="label">유령 상인은 3일마다 와요. 다음 방문: Day ${Math.floor(S.day / 3) * 3 + 3}</p>`;
    else h += `<p>“흐흐… 오늘은 뭘 사겠나?”</p><div class="list">${Object.entries(S.merchant).map(([id, o]) => {
      const sp = id === "special", nm = id === "pig" ? "기본 돼지 (+0)" : sp ? `${FAMS[o.fam].name} 특수 돼지 (+${o.lvl})` : ITEMS[id].name;
      const ds = id === "pig" ? "우리에 바로 들어가요" : sp ? "기본 가치 2배 · 사면 바로 손에 들려요 (손이 비어 있어야 해요)" : ITEMS[id].desc;
      return `<div class="item"><div><b>${nm}</b><span class="tag">남음 ${o.left}</span><p>${ds}</p></div><button data-shop="${id}" ${o.left && S.gold >= o.price && !(sp && S.hand) ? "" : "disabled"}>${G(o.price)}</button></div>`; }).join("")}</div>
      <p class="label">같은 물건을 또 사면 값이 3배가 돼요.</p>`;
  }
  if (s === "tribute") {
    const short = Math.max(0, q - tsum);
    h += `<div class="row"><span>오늘 공물 <b class="num">${G(tsum)}</b> / ${G(q)}</span>${S.hand ? `<button id="offer">창구에 넣기</button>` : ""}</div>`;
    if (!short && tsum > q) h += `<p class="gold">공물을 내고 남는 ${G(tsum - q)}을 골드로 받아요</p>`;
    if (short) h += `<p class="${S.gold >= short ? "gold" : "bad"}">부족 ${G(short)} → ${S.gold >= short ? "보유 골드에서 차감돼요" : `골드 ${G(S.gold)}로도 모자라요`}</p>`;
    if (S.tribute.length) h += `<div class="list">${S.tribute.map((p, i) => pigLine(p, `<button class="ghost" data-take="${i}" ${S.hand ? "disabled" : ""}>꺼내기</button>`)).join("")}</div>`;
    h += `<p class="label">종을 치면 하루가 끝나요. 돼지 가치가 모자라면 보유 골드에서 나머지를 내요. 골드로도 모자라면 분노가 쌓이고, 3번이면 끝이에요. 돼지 가치가 공물보다 많으면 남는 만큼 골드로 받아요.</p>
      <button id="bell" class="${confirmBell ? "hot" : ""}">${confirmBell ? "정말 칠까요? 한 번 더 누르세요" : "종 울리기"}</button>`;
  }
  $("panel").innerHTML = h; save();
}
$("panel").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset, id = b.id;
  if (id !== "bell") confirmBell = false;
  if (id === "strike") return doStrike();
  if (["lift", "place", "drop", "offer"].includes(id) || d.pick || d.take) sfx.play("tap-ui-tick");
  if (id === "lift") { S.hand = S.anvil; S.anvil = null; lastSnap = null; }
  if (id === "place") { S.anvil = S.hand; S.hand = null; lastSnap = null;
    const a = S.anvil; if (S.inherit && a.lvl === 0 && a.strikes === 0) { a.lvl = a.peak = S.inherit; a.charge = Math.min(10, a.charge + 4); banner(`+${S.inherit} 계승`, "새벽의 칼집", "f"); S.inherit = 0; } }
  if (id === "heat") { b.disabled = true; b.textContent = "달구는 중…"; sfx.play("whoosh-short"); const p = S.hand; await sleep(2000); if (S.hand === p) p.heated = true; sparkBurst(at(55, 1.7, .9), 0xff8a3d, 30); sfx.play("pop-bubble"); }
  if (id === "drop") { S.pen.push(S.hand); S.hand = null; }
  if (d.pick) S.hand = S.pen.splice(+d.pick, 1)[0];
  if (id === "feed") { S.hand = null; S.credits++; sparkBurst(bankPos.clone().setY(1.5), 0xff3df2, 30); banner("+1 크레딧", "", "f"); sfx.play("coin-collect"); }
  if (d.buy) { const r = RB[d.buy]; S.credits -= r.cost; S.relics.push(r.id); S.shop = S.shop.filter(x => x !== r.id); banner(r.name, r.desc, "g"); sfx.play("confirm-unlock"); }
  if (id === "reroll") { if (S.freeReroll) S.freeReroll = false; else S.gold -= rerollCost(); S.shop = rollShop(); sfx.play("swipe"); }
  if (d.toss) S.relics = S.relics.filter(x => x !== d.toss);
  if (id === "gift") return pickGift();
  if (d.shop) { const o = S.merchant[d.shop]; S.gold -= o.price; o.left--; o.price *= 3;
    if (d.shop === "pig") S.pen.push(newPig()); else if (d.shop === "special") S.hand = newPig(o.lvl, o.fam); else if (d.shop === "note") S.extra += 2;
    else if (d.shop === "incense") { S.anger = Math.max(0, S.anger - 1); S.incenseUsed = true; } else S.items[d.shop] = (S.items[d.shop] || 0) + 1;
    banner("구매", d.shop === "pig" ? "돼지가 우리에 들어갔어요" : d.shop === "special" ? pigName(S.hand) : ITEMS[d.shop].name, "s"); sfx.play("coin-double"); }
  if (d.use) { const k = d.use;
    if (k === "star") { if (inFrenzy()) return banner("안 돼요", "광란 중엔 못 써요", "h"); S.anvil.charge = Math.min(10, S.anvil.charge + 3); S.items.star--; }
    else if (S.armed[k]) { delete S.armed[k]; S.items[k] = (S.items[k] || 0) + 1; }
    else { S.armed[k] = true; S.items[k]--; banner(ITEMS[k].name, "다음 타격에 적용", "f"); } }
  if (id === "undo" && lastSnap) { S.items.clock--; if (S.anvil) Object.assign(S.anvil, lastSnap.pig); else S.anvil = lastSnap.pig;
    S.armed = lastSnap.armed; S.fenceUsed = lastSnap.fence; S.gold = lastSnap.gold; lastSnap = null; banner("되감기", "마지막 타격을 없던 일로", "f"); }
  if (id === "offer") { S.tribute.push(S.hand); S.hand = null; }
  if (d.take) S.hand = S.tribute.splice(+d.take, 1)[0];
  if (id === "bell") { if (!confirmBell) { confirmBell = true; return ui(); } confirmBell = false; sfx.play("notification-gentle-bell"); bell.rotation.z = .5; setTimeout(() => bell.rotation.z = 0, 300); return ringBell(); }
  ui();
});

function showModal(html, after) { $("modalBody").innerHTML = html; $("modal").hidden = false; after && after(); }
function closeModal() { $("modal").hidden = true; ui(); }
function pickGift() {
  const opts = RELICS.filter(r => r.gift).sort(() => Math.random() - .5).slice(0, 3);
  showModal(`<h2>첫날 선물</h2><p>하나만 가져갈 수 있어요. 나머지는 사라져요.</p><div class="list">${opts.map(r => `<div class="item"><div><b>${r.name}</b><span class="tag">${r.cat}</span><p>${r.desc}</p></div><button data-g="${r.id}">선택</button></div>`).join("")}</div>`,
    () => $("modalBody").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.relics.push(b.dataset.g); S.gift = b.dataset.g; closeModal(); banner(RB[b.dataset.g].name, "선물을 받았어요", "g"); sfx.play("confirm-unlock"); }));
}
function restart() { S = fresh(); uid = 1; morning(); st = 2; closeModal(); pickGift(); }
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("mute").onclick = () => { sfx.toggle(); ui(); };
// iOS Safari ignores user-scalable=no: touch-action stops double-tap zoom, these stop pinch zoom
for (const ev of ["gesturestart", "gesturechange", "dblclick"]) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
const buzz = ms => { try { navigator.vibrate?.(ms); } catch {} };

// Boot
if (!load()) { S = fresh(); morning(); st = 2; }
yaw = STATIONS[st].yaw;
resize(); ui(); requestAnimationFrame(loop);
if (S.day === 1 && !S.gift) pickGift();
</script>
