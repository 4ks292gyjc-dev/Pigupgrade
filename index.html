<style>
/* Layout: full-screen 3D barn forge; HUD top (day/tribute), station panel bottom */
:root{
  --bg:#120d0a; --panel:rgba(28,20,15,.88); --line:#4a3a2c; --text:#f6ead8; --muted:#b29e88; --ember:#ff8a3d;
  --break:#ff4d4d; --dmg:#ff9f43; --hold:#9aa0a8; --ok:#4dabf7; --great:#ffd43b; --frenzy:#ff3df2;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  --frame:#6b5236; --parch-hi:#f5e6c8; --parch-lo:#d4b98c;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{touch-action:manipulation}
#gl{touch-action:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;font-weight:500;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.hud{position:fixed;left:0;right:0;z-index:2;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#top,#bottom{max-width:520px;margin-inline:auto}
#top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));display:grid;gap:6px}
#bottom{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.card{background:linear-gradient(180deg,rgba(44,32,23,.94),rgba(22,15,11,.94));border:1px solid var(--frame);border-radius:4px;padding:8px 10px;
  box-shadow:inset 0 1px 0 rgba(255,214,160,.12),inset 0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.55)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.big{font-family:var(--display);font-size:20px}
.gold{color:var(--great)} .bad{color:var(--break)}
.anger span{font-family:var(--display);font-size:16px;opacity:.25} .anger span.on{opacity:1;color:var(--break)}
#panel{max-height:46vh;overflow:auto;display:grid;gap:8px}
#panel p{margin:0}
#nav{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:center}
#nav b{font-family:var(--display);font-weight:400;font-size:18px;text-align:center;text-shadow:0 2px 4px #000}
button{font-family:var(--display);font-size:16px;letter-spacing:.02em;border:1px solid #4a3220;border-radius:4px;padding:10px;cursor:pointer;color:#2a1a0e;min-height:44px;
  background:linear-gradient(180deg,var(--parch-hi),var(--parch-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 0 #3a2616,0 3px 6px rgba(0,0,0,.4)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 #3a2616}
button small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:0;opacity:.75}
button:focus-visible{outline:3px solid var(--great);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:linear-gradient(180deg,#3a2a1e,#241912);color:var(--text);border-color:var(--frame);box-shadow:inset 0 1px 0 rgba(255,214,160,.14),0 2px 0 #0d0805}
button.hot{background:linear-gradient(180deg,#ffc27a,#f07a2a 55%,#c9531a);border-color:#6a2a0c;color:#2a0e02;box-shadow:inset 0 1px 0 rgba(255,240,200,.7),0 3px 0 #5a2208,0 4px 10px rgba(255,120,40,.3)}
button.armed{outline:3px solid var(--great)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns>button{flex:1 1 30%}
#strike{font-size:24px;flex-basis:100%;min-height:58px}
.odds{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:2px}
.odds span{font-size:11px;font-weight:700;color:var(--muted)} .odds b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)} .stack i{display:block;height:100%}
.charges{display:grid;grid-template-columns:repeat(10,1fr);gap:3px} .charges i{height:8px;border-radius:2px;background:var(--line)} .charges i.on{background:var(--frenzy)}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(107,82,54,.45);border-radius:3px;padding:6px 8px;text-align:left}
.item p{margin:0;font-size:12px;color:var(--muted)}
.item b{font-family:var(--display);font-weight:400;font-size:15px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px;background:var(--line);color:var(--text);margin-left:4px}
#banner{position:fixed;left:50%;top:32%;z-index:5;text-align:center;pointer-events:none;opacity:0;width:100%;transform:translate(-50%,-50%)}
#banner.show{animation:bIn .45s cubic-bezier(.2,1.6,.4,1) forwards,bOut .4s ease-in 1.8s forwards}
@keyframes bOut{to{opacity:0}}
#banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(48px,16vw,110px);line-height:1.05;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 8%,currentColor 48%,color-mix(in srgb,currentColor 55%,#000) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 5px 0 rgba(0,0,0,.85)) drop-shadow(0 0 22px color-mix(in srgb,currentColor 35%,transparent))}
#banner small{display:block;font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--text);text-shadow:0 1px 0 #000,0 0 6px #000;margin-top:8px}
#banner.g b{color:var(--great)} #banner.s b{color:var(--ok)} #banner.h b{color:var(--hold)} #banner.d b{color:var(--dmg)}
#banner.b b,#banner.fake b{color:var(--break);animation:jit .07s infinite} #banner.f b{color:var(--frenzy)}
@keyframes bIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes jit{25%{transform:translate(-4px,2px) skewX(8deg)}75%{transform:translate(4px,-2px) skewX(-8deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#ring{position:fixed;left:50%;top:40%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:3;pointer-events:none;
  background:conic-gradient(var(--great) calc(var(--p,0)*1turn),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(closest-side,transparent 88%,#000 89%);mask:radial-gradient(closest-side,transparent 88%,#000 89%)}
#ringText{position:fixed;left:50%;top:calc(40% + min(35vw,150px) + 18px);transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:22px;color:var(--great);pointer-events:none;white-space:nowrap;text-shadow:0 2px 4px #000}
#frenzyBar{position:fixed;left:0;right:0;top:0;height:5px;background:var(--frenzy);transform-origin:left;z-index:6;box-shadow:0 0 16px var(--frenzy)}
.modal{position:fixed;inset:0;background:rgba(10,7,5,.92);display:grid;place-items:center;padding:20px;z-index:8}
.modal>div{display:grid;gap:10px;max-width:380px;width:100%;text-align:center;max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.modal h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.modal p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#banner b{animation:none!important}}
/* Title menu over the slowly turning forge */
body.menu .hud,body.ko .hud,body.cine .hud{opacity:0;pointer-events:none}
.hud{transition:opacity .4s}
#menu{position:fixed;inset:0;z-index:9;display:grid;grid-template-rows:1fr auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 70% at 50% 40%,transparent 30%,rgba(8,5,3,.75) 75%),linear-gradient(180deg,rgba(8,5,3,.55),transparent 30%,transparent 55%,rgba(8,5,3,.92))}
#menu .head{align-self:center;text-align:center;margin-top:-12vh}
#menu .kicker{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.35em;color:var(--ember);margin:0 0 6px;text-shadow:0 1px 0 #000}
#menu h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,17vw,96px);line-height:1;color:var(--great);
  background:linear-gradient(180deg,#fff6d8 5%,#ffc94a 45%,#b8641a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000) drop-shadow(0 6px 0 rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(255,140,40,.35))}
#menu .best{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-shadow:0 1px 2px #000}
#menu .foot{width:100%;max-width:340px;margin-inline:auto;display:grid;gap:8px}
#menu .foot>button{min-height:52px;font-size:19px}
#menu .achPanel{width:100%;max-width:440px;margin-inline:auto;align-self:end;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;height:min(76vh,calc(100dvh - 90px));min-height:0}
#menu .achPanel .scroll{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;display:grid;gap:10px;padding-right:2px;align-content:start}
#menu textarea{width:100%;box-sizing:border-box;min-height:120px;background:#140e0a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.4 monospace;user-select:text;-webkit-user-select:text;resize:none}
#shopList .spin>div{animation:reel .09s linear infinite}
#shopList .land{animation:land .35s ease-out}
@keyframes reel{from{transform:translateY(-9px);opacity:.35}to{transform:translateY(9px);opacity:1}}
@keyframes land{0%{transform:scale(1.08);box-shadow:0 0 0 2px var(--great),0 0 18px var(--great)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){#shopList .spin>div,#shopList .land{animation:none}}
.dexGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dexCell{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;display:grid;gap:2px;align-content:start}
.dexCell img,.dexCell span{width:100%;aspect-ratio:1;display:grid;place-items:center}
.dexCell span{font-family:var(--display);font-size:26px;color:var(--line)}
.dexCell small{font-size:10px;line-height:1.25;color:var(--muted);font-weight:700}
.dexCell.seen small{color:var(--text)}
.item img.vthumb{width:54px;height:54px;flex:none}
#menu .achPanel h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.item.done{border-color:rgba(255,212,59,.5)} .item.done .label{color:var(--great)} .item.locked{opacity:.6}
/* Knock-out: eyelids close from top and bottom */
.lid{position:fixed;left:-10%;right:-10%;height:0;background:#000;z-index:7;pointer-events:none}
#lidT{top:0;border-radius:0 0 50% 50%/0 0 40% 40%} #lidB{bottom:0;border-radius:50% 50% 0 0/40% 40% 0 0}
</style>

</div>

</div>

// ===== Save safety: every progress key is mirrored into IndexedDB (a second store that survives some localStorage wipes) and can be exported as a code =====
const SAVE_KEYS = ["pigforge", "pigforge-unlocks", "pigforge-ach", "pigforge-dex", "pigforge-breeds", "pigforge-mute", "pigforge-best"];
let storeReady = false, mirrorT = 0, noFlush = false; // noFlush: set right before a reload that brings in a different save, so the old state is not written back over it
const idbOpen = () => new Promise((ok, no) => { try { const r = indexedDB.open("pigforge", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } });
const snapshotSave = () => { const o = {}; for (const k of SAVE_KEYS) { try { const v = localStorage.getItem(k); if (v != null) o[k] = v; } catch {} } return o; };
function mirror() { if (!storeReady) return; clearTimeout(mirrorT); mirrorT = setTimeout(async () => { try { const db = await idbOpen(), o = snapshotSave(); if (Object.keys(o).length) db.transaction("kv", "readwrite").objectStore("kv").put(o, "save"); } catch {} }, 600); }
(async () => { // if the browser dropped localStorage but IndexedDB still has the save, put it back and reload once
  try { const empty = !SAVE_KEYS.some(k => localStorage.getItem(k));
    if (empty && !sessionStorage.getItem("pf-restored")) { const db = await idbOpen(), r = db.transaction("kv").objectStore("kv").get("save");
      const saved = await new Promise(ok => { r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
      if (saved && Object.keys(saved).length) { for (const k in saved) if (SAVE_KEYS.includes(k)) localStorage.setItem(k, saved[k]); sessionStorage.setItem("pf-restored", "1"); noFlush = true; return location.reload(); } } } catch {}
  storeReady = true; mirror(); })();
const flushSave = () => { if (noFlush) return; try { if (S) { S.uid = uid; localStorage.setItem("pigforge", JSON.stringify(S)); } } catch {} mirror(); };
addEventListener("pagehide", flushSave); document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });
addEventListener("pointerdown", () => { try { navigator.storage?.persist?.(); } catch {} }, { once: true }); // ask the browser not to evict our data
function saveCode() { return btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, d: snapshotSave() })))); }
function loadCode(code) { try { const o = JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g, ""))))); if (o.v !== 1 || typeof o.d !== "object" || !o.d.pigforge && !o.d["pigforge-ach"]) return false;
  for (const k in o.d) if (SAVE_KEYS.includes(k) && typeof o.d[k] === "string") { JSON.parse(o.d[k] === "" ? "0" : o.d[k]); localStorage.setItem(k, o.d[k]); } return true; } catch { return false; } }

const sfx = (() => {
  let muted = false; try { muted = localStorage.getItem("pigforge-mute") === "1"; } catch {}
  const AC = window.AudioContext || window.webkitAudioContext, ctx = AC && new AC(), buf = {}, last = {};
  if (!ctx) return { play() {}, ambience() {}, get muted() { return muted; }, toggle() { muted = !muted; } };
  const master = ctx.createGain(), amb = ctx.createGain(); master.gain.value = muted ? 0 : 1; amb.gain.value = 0;
  master.connect(ctx.destination); amb.connect(master);
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} // keep playing with the ringer switch off, like <audio> did
  const files = new Set(Object.values(SND).flatMap(s => s.f)); files.add("fire-loop");
  for (const f of files) fetch(`sfx/${f}.mp3`).then(r => r.arrayBuffer()).then(a => new Promise((ok, no) => ctx.decodeAudioData(a, ok, no)))
    .then(b => { buf[f] = b; if (f === "fire-loop") { const src = ctx.createBufferSource(); src.buffer = b; src.loop = true; src.loopStart = .06; src.loopEnd = b.duration - .06; src.connect(amb); src.start(); } })
    .catch(() => {});
  const unlock = () => { if (ctx.state !== "running") ctx.resume(); };
  for (const ev of ["pointerdown", "touchend", "keydown"]) addEventListener(ev, unlock, { capture: true, passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? ctx.suspend() : ctx.resume());
  let ambLevel = -1;
  return {
    play(...ids) { if (muted) return;
      for (const id of ids) { const s = SND[id]; if (!s) continue;
        const n = s.f.length, i = n > 1 ? ((last[id] ?? -1) + 1 + Math.floor(Math.random() * (n - 1))) % n : 0; last[id] = i;
        const b = buf[s.f[i]]; if (!b) continue;
        const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = b; src.playbackRate.value = 1 + (Math.random() * 2 - 1) * (s.p || 0); g.gain.value = s.v;
        src.connect(g); g.connect(master); src.start(); } },
    ambience(level) { if (Math.abs(level - ambLevel) < .02) return; ambLevel = level; amb.gain.setTargetAtTime(level, ctx.currentTime, .25); },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("pigforge-mute", muted ? "1" : "0"); } catch {} master.gain.value = muted ? 0 : 1; },
  };
})();

function evolve(p, res) {
  if (FAMS[p.fam]?.special) return;
  if (p.fam && !p.lane) p.lane = FAMS[p.fam].lane; // pigs from older saves already had a family
  const h = p.hist || {}, look = Math.max(p.lvl, p.peak || 0);

async function spinShop() {
  const rows = [...document.querySelectorAll("#shopList .item")]; if (!rows.length || reduced) return;
  spinning = true; const rr = $("reroll"); if (rr) rr.disabled = true;
  const reels = rows.map((row, i) => { const txt = row.firstElementChild, btn = row.querySelector("button"), final = txt.innerHTML, off = btn.disabled, cost = btn.textContent;
    row.classList.add("spin"); btn.disabled = true; btn.textContent = "?";
    return { row, txt, btn, final, off, cost, stop: performance.now() + 750 + i * 450 }; });
  while (reels.some(r => !r.done)) {
    const now = performance.now(); let ticked = false;
    for (const r of reels) { if (r.done) continue;
      if (!r.row.isConnected) { r.done = true; continue; } // the panel was redrawn (station changed): nothing left to animate
      if (now >= r.stop) { r.done = true; r.txt.innerHTML = r.final; r.btn.disabled = r.off; r.btn.textContent = r.cost; r.row.classList.remove("spin"); r.row.classList.add("land"); sfx.play("gem"); buzz(20); continue; }
      const x = RELICS[Math.floor(Math.random() * RELICS.length)]; r.txt.innerHTML = `<b>${x.name}</b><span class="tag">${x.cat}</span><p>${x.desc}</p>`; ticked = true; }
    if (ticked) sfx.play("tick");
    await sleep(75);
  }
  await sleep(380); spinning = false; if (rr && rr.isConnected) ui(); // let the last slot finish its landing flash
}
function showModal(html, after) { $("modalBody").innerHTML = html; $("modal").hidden = false; after && after(); }
function closeModal() { $("modal").hidden = true; ui(); }
const achCount = () => `${achs.filter(k => ACH[k]).length}/${Object.keys(ACH).length}`;
const achList = () => Object.entries(ACH).map(([k, a]) =>
  `<div class="item ${achieved(k) ? "done" : "locked"}"><div><b>${a.name}</b>${a.relic ? `<span class="tag">${RB[a.relic].name}</span>` : ""}<p>${a.desc}</p></div><span class="label">${achieved(k) ? "달성" : "미달성"}</span></div>`).join("");
const mwList = () => Object.entries(FAMS).map(([k, f]) =>
  `<div class="item ${unlocked(k) ? "done" : "locked"}"><div><b>${unlocked(k) ? RB[f.mw].name : "???"}</b><span class="tag">${f.name}${f.special ? " · 특수" : ""}</span><p>${unlocked(k) ? RB[f.mw].desc : `${f.name} 돼지 +20 달성 시 해금`}</p></div><span class="label">${unlocked(k) ? "해금" : "잠김"}</span></div>`).join("");

// ===== Title menu =====
let dexFromPause = false, menu = false, confirmNew = false, bestDay = 0; try { bestDay = +localStorage.getItem("pigforge-best") || 0; } catch {}
const alive = () => S && S.anger < 3;
const inProgress = () => alive() && (S.day > 1 || S.gift);
function showMenu(view = "main") {
  menu = true; confirmNew = view === "confirm"; document.body.classList.add("menu"); const m = $("menu"); m.hidden = false;
  if (view === "save") {
    m.innerHTML = `<div></div><div class="achPanel"><div class="row"><h2>저장 백업</h2><button class="ghost" id="mBack" style="min-height:38px;padding:6px 14px">뒤로</button></div>
      <div class="scroll"><p class="label">진행 상황은 이 기기의 브라우저에 자동 저장돼요. 다른 기기로 옮기거나 백업하려면 아래 코드를 복사해서 다른 기기에서 붙여 넣으세요.</p>
      <textarea id="sOut" readonly>${saveCode()}</textarea><button class="hot" id="sCopy">코드 복사</button>
      <div class="label">다른 기기의 코드 불러오기 (지금 진행 상황이 바뀌어요)</div><textarea id="sIn" placeholder="여기에 붙여 넣기"></textarea><button class="ghost" id="sLoad">불러오기</button><p class="label" id="sMsg"></p></div></div>`;
  } else if (view === "dex") {
    const cell = (k, label, q) => dex.includes(k) ? `<div class="dexCell seen"><img alt="" data-t='${JSON.stringify(q)}'><small>${label}</small></div>` : `<div class="dexCell"><span>?</span><small>${label.split(" ")[0]} ???</small></div>`;
    const groups = DEX_GROUPS.map(([g, name, n]) => `<div class="label">${name} ${dex.filter(k => k.startsWith(g + ":")).length}/${n}</div><div class="dexGrid">${Array.from({ length: n }, (_, i) =>
      g === "g" ? cell(`g:${i}`, `+${i} ${NAMES[i]}`, { lvl: i, fam: "citadel" }) : cell(`${g}:${i}`, `+${i * 2} ${FAMS[g].forms[i]} 돼지`, { lvl: i * 2, fam: g })).join("")}</div>`).join("");
    const breeds = Object.entries(BREEDS).filter(([id]) => id !== "base").map(([id, b]) => `<div class="item ${breedOpen(id) ? "done" : "locked"}">
      <div style="display:flex;gap:8px;align-items:center">${breedOpen(id) ? `<img class="vthumb" alt="" data-t='${JSON.stringify({ lvl: 9, fam: "citadel", breed: id })}'>` : ""}<div><b>${breedOpen(id) ? b.name + " 돼지" : "???"}</b><p>${breedOpen(id) ? `${b.desc} · <b style="font-size:12px">${b.fx}</b>` : breedCond(b)}</p></div></div>
      <span class="label">${breedOpen(id) ? "해금" : "잠김"}</span></div>`).join("");
    const tree = Object.entries(LANES).map(([ln, l]) => `<div class="label">${dex.includes("lane:" + ln) ? `${l.name} 갈래` : "??? 갈래"} · +5에서 ${l.why}</div><div class="dexGrid">${l.fams.flatMap(f => FAMS[f].forms.map((nm, i) =>
      cell(`f:${f}:${i}`, `+${10 + i * 2} ${nm} 돼지`, { lvl: 10 + i * 2, fam: f, lane: ln }))).join("")}</div><p class="label">+10을 넘길 때 대성공이면 ${FAMS[l.fams[1]].name}, 아니면 ${FAMS[l.fams[0]].name} 계열이 돼요.</p>`).join("");
    m.innerHTML = `<div></div><div class="achPanel"><div class="row"><h2>도감 <span class="gold">${dex.length}/${DEX_TOTAL}</span></h2><button class="ghost" id="mBack" style="min-height:38px;padding:6px 14px">뒤로</button></div>
      <div class="scroll">${groups}<div class="label" style="color:var(--great);margin-top:6px">테크트리 · 강화 방식에 따라 갈래와 계열이 갈라져요</div>${tree}<div class="label">변종 ${openBreeds().length}/${Object.keys(BREEDS).length - 1} · 업적과 도감을 채우면 새 변종이 배달 돼지에 섞여 와요. 변종마다 능력이 달라요</div><div class="list">${breeds}</div></div></div>`;
    const imgs = [...m.querySelectorAll("img[data-t]")]; // portraits are drawn a few per frame so the list opens instantly
    (function next() { const im = imgs.shift(); if (!im || !im.isConnected) return; im.src = thumb(JSON.parse(im.dataset.t)); setTimeout(next, 0); })();
  } else if (view === "ach") {
    m.innerHTML = `<div></div><div class="achPanel"><div class="row"><h2>업적 <span class="gold">${achCount()}</span></h2><button class="ghost" id="mBack" style="min-height:38px;padding:6px 14px">뒤로</button></div>
      <div class="scroll"><div class="list">${achList()}</div><div class="label">걸작 해금 ${unlocks.length}/9 · 계열 돼지를 +20까지 만들면 유물 진열장에 나와요</div><div class="list">${mwList()}</div></div></div>`;
  } else {
    m.innerHTML = `<div class="head"><p class="kicker">멧돼지 군주의 대장간</p><h1>돼지<br>강화하기</h1>${bestDay ? `<p class="best">최고 기록 · Day ${bestDay}</p>` : ""}</div>
      <div class="foot">${inProgress() ? `<button class="hot" id="mCont">이어하기<small>Day ${S.day} · 분노 ${S.anger}/3 · 골드 ${G(S.gold)}</small></button>` : ""}
      <button class="${inProgress() ? "ghost" : "hot"}" id="mNew">${confirmNew ? "진행 중인 판이 사라져요. 한 번 더 누르세요" : "새로 시작"}</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="ghost" id="mAch" style="min-height:52px;font-size:17px">업적 ${achCount()}</button><button class="ghost" id="mDex" style="min-height:52px;font-size:17px">도감 ${dex.length}/${DEX_TOTAL}</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="ghost" id="mSave" style="min-height:52px;font-size:17px">저장 백업</button><button class="ghost" id="mSnd" style="min-height:52px;font-size:17px">${sfx.muted ? "소리 끔" : "소리 켬"}</button></div></div>`;
  }
  m.querySelectorAll("button").forEach(b => b.onclick = () => { sfx.play("tick"); menuClick(b.id); });
}
function menuClick(id) {
  if (id === "mBack" && dexFromPause) { dexFromPause = false; hideMenu(); return pause(); }
  if (id === "mBack") return showMenu();
  if (id === "mDex") return showMenu("dex");
  if (id === "mSave") return showMenu("save");
  if (id === "sCopy") { const ta = $("sOut"), done = () => { $("sCopy").textContent = "복사됨!"; setTimeout(() => $("sCopy") && ($("sCopy").textContent = "코드 복사"), 1500); };
    return navigator.clipboard ? navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); }) : (ta.select(), document.execCommand("copy"), done()); }
  if (id === "sLoad") { const v = $("sIn").value.trim(), msg = $("sMsg"); if (!v) { msg.textContent = "코드를 붙여 넣어 주세요."; return; }
    if (!loadCode(v)) { msg.textContent = "올바른 저장 코드가 아니에요. 처음부터 끝까지 복사했는지 확인해 주세요."; msg.style.color = "var(--break)"; return; }
    msg.textContent = "불러왔어요! 다시 시작해요…"; msg.style.color = "var(--ok)"; noFlush = true; return setTimeout(() => location.reload(), 600); }
  if (id === "mAch") return showMenu("ach");
  if (id === "mSnd") { sfx.toggle(); return showMenu(); }
  if (id === "mNew" && inProgress() && !confirmNew) return showMenu("confirm");
  if (id === "mNew") { newRun(); hideMenu(); return pickGift(); }
  if (id === "mCont") { hideMenu(); if (S.day === 1 && !S.gift) pickGift(); }
}
function hideMenu() { thawFrenzy(); menu = false; $("menu").hidden = true; document.body.classList.remove("menu"); yaw = STATIONS[st].yaw + 40; sfx.play("swish"); ui(); }
function newRun() { resetKO(); frenzyLeft = 0; frenzyUntil = 0; S = fresh(); uid = 1; morning(); st = 2; save(); }

// ===== Game over: the boar lord punches the camera, the view falls and the eyes slowly close =====
let ko = null;
const FIST = 1.75; // fingers fold 90° down then back into the palm so the knuckles face the lens
function resetKO() { ko = null; collecting = false; document.body.classList.remove("ko"); $("lidT").style.height = $("lidB").style.height = "0"; $("gl").style.filter = ""; }
async function knockout(day, total, q) {
  collecting = true; document.body.classList.add("ko"); confirmBell = false;
  const sp = reduced ? .4 : 1, gate = hatch.userData.gate;
  st = 5; rageT = 5; sfx.play("roar", "chain"); buzz([200, 80, 200]);
  await tween(450 * sp, k => gate.scale.y = 1 - .93 * k);
  arm.visible = true; poseArm(-1.4, -.1, 0, FIST);
  await tween(550 * sp, k => poseArm(lerp(-1.4, -.35, k), lerp(-.1, .05, k), -.2 * k, FIST)); // wind up in the opening
  sfx.play("grunt"); await sleep(180 * sp); sfx.play("swish");
  await tween(170 * sp, k => poseArm(lerp(-.35, 2.85, k * k), lerp(.05, .4, k), lerp(-.2, 0, k), FIST)); // straight at the lens
  sfx.play("heavy", "dent", "thud"); flash(1); shakeT = .45; buzz([400]);
  ko = { y: 1.55, tilt: 0, roll: 0 };
  tween(350, k => poseArm(lerp(2.85, -1.4, k), lerp(.4, -.1, k), 0, FIST)).then(() => { arm.visible = false; tween(400, k => gate.scale.y = .07 + .93 * k); });
  await tween(900 * sp, k => { ko.y = lerp(1.55, .45, k); ko.tilt = lerp(0, .95, k); ko.roll = lerp(0, .38, k); }); // fall on your back
  sfx.play("thud"); shakeT = .15;
  const lids = h => { $("lidT").style.height = $("lidB").style.height = h + "vh"; $("gl").style.filter = `blur(${(h / 9).toFixed(1)}px)`; };
  for (const [a, b, ms] of [[0, 30, 700], [30, 12, 450], [12, 42, 800], [42, 28, 350], [28, 53, 1100]]) await tween(ms * sp, k => lids(lerp(a, b, k)));
  await sleep(500 * sp);
  showModal(`<h2 class="bad">녹아웃</h2><p>Day ${day} 공물 ${G(total)} / ${G(q)}<br>철창 너머의 멧돼지 군주가 인내심을 잃었어요.</p>
    <button class="hot" id="again">처음부터</button><button class="ghost" id="toMenu">메인 화면</button>`, () => { $("again").onclick = restart; $("toMenu").onclick = () => { closeModal(); newRun(); showMenu(); }; });
  flushToasts(600);
}
function pickGift() {
  const opts = RELICS.filter(r => r.gift).sort(() => Math.random() - .5).slice(0, 3);
  showModal(`<h2>첫날 선물</h2><p>하나만 가져갈 수 있어요. 나머지는 사라져요.</p><div class="list">${opts.map(r => `<div class="item"><div><b>${r.name}</b><span class="tag">${r.cat}</span><p>${r.desc}</p></div><button data-g="${r.id}">선택</button></div>`).join("")}</div>`,
    () => $("modalBody").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.relics.push(b.dataset.g); S.gift = b.dataset.g; closeModal(); banner(RB[b.dataset.g].name, "선물을 받았어요", "g"); sfx.play("gem"); }));
}
function restart() { newRun(); closeModal(); pickGift(); }
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("mute").onclick = () => { sfx.toggle(); ui(); };
// ===== Pause: resume, restart from day 1, or back to the title. A running frenzy is frozen until play resumes =====
let paused = false, frenzyLeft = 0;
function freezeFrenzy() { if (!frenzyLeft && inFrenzy()) { frenzyLeft = frenzyUntil - performance.now(); frenzyUntil = Infinity; } }
function thawFrenzy() { if (frenzyLeft) { frenzyUntil = performance.now() + frenzyLeft; frenzyLeft = 0; } }
function pause(confirmRestart = false) {
  if (menu || ko || busy || collecting || (!paused && !$("modal").hidden)) return;
  paused = true; freezeFrenzy(); sfx.play("tick");
  showModal(`<h2>일시정지</h2><p>Day ${S.day} · 분노 ${S.anger}/3 · 골드 ${G(S.gold)}</p>
    <button class="hot" id="pResume">마저하기</button>
    <button class="ghost" id="pRestart">${confirmRestart ? "진행 중인 판이 사라져요. 한 번 더 누르세요" : "처음부터 다시 시작하기"}</button>
    <button class="ghost" id="pDex">도감 ${dex.length}/${DEX_TOTAL}</button>
    <button class="ghost" id="pMain">메인 화면으로</button>`, () => {
    $("pDex").onclick = () => { paused = false; $("modal").hidden = true; dexFromPause = true; sfx.play("tick"); showMenu("dex"); };
    $("pResume").onclick = resume;
    $("pRestart").onclick = () => { if (!confirmRestart) return pause(true); paused = false; frenzyLeft = 0; frenzyUntil = 0; sfx.play("tick"); restart(); };
    $("pMain").onclick = () => { paused = false; $("modal").hidden = true; save(); sfx.play("tick"); showMenu(); }; // frenzy stays frozen until 이어하기
  });
}
function resume() { if (!paused) return; paused = false; thawFrenzy(); sfx.play("tick"); closeModal(); }
$("pause").onclick = () => pause();
addEventListener("keydown", e => { if (e.code === "Escape") paused ? resume() : pause(); });
// iOS Safari ignores user-scalable=no: touch-action stops double-tap zoom, these stop pinch zoom
for (const ev of ["gesturestart", "gesturechange", "dblclick"]) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
const buzz = ms => { try { navigator.vibrate?.(ms); } catch {} };

// Boot
if (!load() || !alive()) { S = fresh(); morning(); st = 2; }
yaw = STATIONS[st].yaw;
resize(); ui(); requestAnimationFrame(loop);
showMenu();
</script>
