<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 허브</title>
<style>
:root{color-scheme:dark}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#12151f;color:#eee;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 40px;box-sizing:border-box}
h1{margin:.2em 0 .6em}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.games a{display:block;padding:28px 12px;text-align:center;background:#222a3d;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.box{background:#1b2133;border-radius:14px;padding:14px;margin-top:16px}
input,button,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #445;background:#0d1019;color:#eee}
button{cursor:pointer;background:#3558d6;border-color:#3558d6}
button.alt{background:#0d1019;border-color:#445}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{width:7.5em}
#msg{color:#ff9d9d;min-height:1.4em;margin:6px 0 0}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:4px 6px;border-bottom:1px solid #2a3350}td:last-child{text-align:right}
</style></head><body><main>
<h1>🎮 게임 허브</h1>
<div class="games"><a href="/jjapbird/">짭새의 모험</a><a href="/pig/">돼지 강화하기</a></div>

<div class="box" id="auth">
  <div id="out" class="row">
    <input id="id" placeholder="아이디" maxlength="12" autocomplete="username">
    <input id="pin" placeholder="비번 4자리" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password">
    <button id="login">로그인</button><button id="reg" class="alt">가입</button>
  </div>
  <div id="in" class="row" hidden><span id="me"></span><button id="logout" class="alt">로그아웃</button></div>
  <p id="msg"></p>
</div>

<div class="box">
  <div class="row"><b>랭킹</b>
    <select id="board">
      <option value="jj-0">짭새 1단계 (시간)</option><option value="jj-1">짭새 2단계</option>
      <option value="jj-2">짭새 3단계</option><option value="jj-3">짭새 4단계</option>
      <option value="jj-full">짭새 전체 이어서</option><option value="jj-hard">짭새 하드코어</option>
      <option value="pig">돼지 강화 (최고 Day)</option>
    </select></div>
  <table id="rank"></table>
</div>

<script>
const $=id=>document.getElementById(id), L=localStorage;
const api=async(a,body)=>{const r=await fetch('/api?a='+a,body?{method:'POST',body:JSON.stringify(body)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error);return j};
const show=()=>{const id=L.getItem('hub-id'),tok=L.getItem('hub-token');$('out').hidden=!!tok;$('in').hidden=!tok;$('me').textContent=id?id+' 님':''};
const auth=a=>async()=>{$('msg').textContent='';try{const j=await api(a,{id:$('id').value.trim(),pin:$('pin').value});L.setItem('hub-token',j.token);L.setItem('hub-id',j.id);$('pin').value='';show();rank()}catch(e){$('msg').textContent=e.message}};
$('login').onclick=auth('login');$('reg').onclick=auth('register');
$('logout').onclick=()=>{L.removeItem('hub-token');L.removeItem('hub-id');show()};
const fmt=(b,s)=>b==='pig'?'Day '+s:Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0');
async function rank(){const b=$('board').value;$('rank').innerHTML='';try{const{rows}=await api('rank&board='+b);const me=L.getItem('hub-id');
 $('rank').innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id===me?'<b>':''}${r.id.replace(/[<&]/g,'')}</td><td>${fmt(b,r.score)}</td></tr>`).join(''):'<tr><td>아직 기록이 없어요</td></tr>'}catch(e){$('rank').innerHTML='<tr><td>'+e.message+'</td></tr>'}}
$('board').onchange=rank;show();rank();
</script></main></body></html>
