<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>게임 허브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 위에 두 게임 간판(각 게임의 색), 아래 오락실 기록판. 한 열, 최대 600px */
:root{
  --ground:#e9ecf1; --paper:#f7f8fa; --ink:#191c24; --dim:#5d6473; --rule:#cfd4dd; --gold:#b98a10; --mine:#fbefc8;
  --jj-a:#2f5d9e; --jj-b:#0f2a52; --jj-siren:#d0201c; --pig-a:#6a3a1c; --pig-b:#1d120b; --ember:#ff8a3d;
  --display:"Black Han Sans","Apple SD Gothic Neo",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#10131a;--paper:#181c25;--ink:#e8eaef;--dim:#9aa1b0;--rule:#2b313e;--gold:#f4c542;--mine:#3a3217;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#10131a;--paper:#181c25;--ink:#e8eaef;--dim:#9aa1b0;--rule:#2b313e;--gold:#f4c542;--mine:#3a3217;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
main{max-width:600px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:400 28px/1 var(--display);margin:0;letter-spacing:.01em}
#me{font-size:14px;color:var(--dim)} #me b{color:var(--ink)}
.link{font:inherit;font-size:14px;background:none;border:0;padding:4px 0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* 게임 간판 */
.games{display:grid;gap:12px}
.game{position:relative;display:grid;gap:10px;padding:20px 20px 18px;border-radius:6px;color:#fff;text-decoration:none;overflow:hidden;transition:transform .15s}
.game:hover{transform:translateY(-2px)}
.game:active{transform:none}
.game h2{font:400 34px/1.05 var(--display);margin:0}
.game p{margin:0;font-size:14px;line-height:1.5;max-width:30em;opacity:.85;word-break:keep-all}
.game .go{position:absolute;right:18px;top:20px;font:600 13px var(--mono);opacity:.75}
.jj{background:linear-gradient(170deg,var(--jj-a),var(--jj-b))}
.jj::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:repeating-linear-gradient(90deg,var(--jj-siren) 0 24px,#2b6fe0 24px 48px)}
.alt-ruler{display:flex;font:500 11px/1.3 var(--mono);margin-top:4px;border-top:1px solid #ffffff40}
.alt-ruler span{flex:var(--w);padding-top:6px;border-left:1px solid #ffffff40;padding-left:6px;min-width:0}
.alt-ruler span:first-child{border-left:0;padding-left:0}
.alt-ruler i{display:block;font-style:normal;font-family:var(--body);font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pig{background:radial-gradient(120% 140% at 100% 100%,#a8441a 0,var(--pig-a) 35%,var(--pig-b) 80%)}
.pig .kicker{font:600 12px var(--mono);color:var(--ember);letter-spacing:.06em;opacity:1}

/* 오른쪽 위 계정 */
.acct{margin-left:auto;font-size:14px}
.acct #out{display:flex;gap:6px}
button.sm{font-size:14px;padding:6px 12px}
/* 로그인 팝업 */
#auth{width:min(360px,calc(100vw - 32px));padding:0;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
#auth::backdrop{background:#000a}
#auth form{display:grid;gap:12px;padding:22px 20px 18px;position:relative}
#auth h3{margin:0;font:400 24px var(--display)}
#auth .hint{margin:0;font-size:13px;color:var(--dim)}
#auth label{display:grid;gap:4px;font-size:13px;color:var(--dim)}
#auth .x{position:absolute;top:6px;right:8px;width:40px;height:40px;font-size:24px;background:none;border:0;color:var(--dim);cursor:pointer}
#auth .switch{margin:0;font-size:14px;color:var(--dim);text-align:center}
input{font:16px var(--body);padding:9px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--ground);color:var(--ink);width:100%}
#pin{font-family:var(--mono);letter-spacing:.3em}
button.solid{font:600 15px var(--body);padding:10px 16px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.ghost{font:600 15px var(--body);padding:9px 14px;border-radius:4px;border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer}
#msg{margin:0;font-size:13px;color:var(--jj-siren);min-height:1.2em}

/* 기록판 */
.board h3{font:400 22px var(--display);margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:14px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--dim);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tabs .sep{flex:none;width:1px;background:var(--rule);margin:4px 2px}
.unit{font-size:12px;color:var(--dim);margin:8px 0 0}
table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
td{padding:9px 4px;border-bottom:1px solid var(--rule)}
td.n{width:2.6em;font:600 14px var(--mono);color:var(--dim)}
td.s{text-align:right;font:600 15px var(--mono)}
tr.top td.n{color:var(--gold)}
tr.top td.who{font-weight:700}
tr.mine td{background:var(--mine)}
td.empty{color:var(--dim);text-align:left;padding:20px 4px}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style></head><body><main>

<header>
  <h1>게임 허브</h1>
  <nav class="acct">
    <span id="out"><button id="open-login" class="ghost sm">로그인</button><button id="open-reg" class="solid sm">회원가입</button></span>
    <span id="in" hidden><span id="me"></span> · <button id="logout" class="link">로그아웃</button></span>
  </nav>
</header>

<section class="games" aria-label="게임">
  <a class="game jj" href="/jjapbird/">
    <span class="go">플레이 →</span>
    <h2>짭새의 모험</h2>
    <p>서부경찰서에서 쫓겨난 전설의 짭새. 국세횡령왕 자리를 되찾으려면 꼭대기까지 날아올라야 한다.</p>
    <div class="alt-ruler" aria-label="단계별 고도">
      <span style="--w:140">0<i>도시 폐허</i></span><span style="--w:150">140<i>공사장</i></span><span style="--w:160">290<i>공중 정원</i></span><span style="--w:170">450<i>성층권</i></span>
    </div>
  </a>
  <a class="game pig" href="/pig/">
    <span class="go">플레이 →</span>
    <p class="kicker">공물 창 너머의 용</p>
    <h2>돼지 강화하기</h2>
    <p>망치로 두드려 돼지를 강화하고, 매일 공물을 채워 하루를 넘긴다. 며칠까지 버틸 수 있을까.</p>
  </a>
</section>

<dialog id="auth" aria-labelledby="auth-h">
  <form id="auth-form" method="dialog">
    <button type="button" class="x" id="auth-close" aria-label="닫기">×</button>
    <h3 id="auth-h">로그인</h3>
    <p class="hint">로그인하면 게임 기록이 기록판에 자동으로 올라갑니다.</p>
    <label for="id">아이디<input id="id" maxlength="12" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="2~12자" required></label>
    <label for="pin">비밀번호 (숫자 4자리)<input id="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="current-password" placeholder="0000" required></label>
    <p id="msg" role="alert"></p>
    <button id="auth-go" class="solid" type="submit">로그인</button>
    <p class="switch"><span id="sw-text">처음이세요?</span> <button type="button" id="sw" class="link">회원가입</button></p>
  </form>
</dialog>

<section class="board" aria-labelledby="board-h">
  <h3 id="board-h">기록판</h3>
  <div class="tabs" id="tabs">
    <button data-b="jj-0">도시 폐허</button><button data-b="jj-1">공사장</button><button data-b="jj-2">공중 정원</button><button data-b="jj-3">성층권</button>
    <button data-b="jj-full">전체 이어서</button><button data-b="jj-hard">하드코어</button>
    <span class="sep" aria-hidden="true"></span><button data-b="pig">돼지 강화</button>
  </div>
  <p class="unit" id="unit"></p>
  <table><tbody id="rank"></tbody></table>
</section>

<script>
const $=id=>document.getElementById(id), L=localStorage;
const api=async(a,body)=>{const r=await fetch('/api?a='+a,body?{method:'POST',body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({error:'서버에 연결하지 못했습니다'}));if(!r.ok)throw new Error(j.error);return j};
const show=()=>{const id=L.getItem('hub-id'),tok=L.getItem('hub-token');$('out').hidden=!!tok;$('in').hidden=!tok;$('me').innerHTML=id?'<b></b> 님':'';if(id)$('me').firstChild.textContent=id};
let mode='login';
const open=m=>{mode=m;const reg=m==='register';$('auth-h').textContent=$('auth-go').textContent=reg?'회원가입':'로그인';
  $('sw-text').textContent=reg?'이미 아이디가 있나요?':'처음이세요?';$('sw').textContent=reg?'로그인':'회원가입';
  $('pin').autocomplete=reg?'new-password':'current-password';$('msg').textContent='';if(!$('auth').open)$('auth').showModal();$('id').focus()};
$('open-login').onclick=()=>open('login');$('open-reg').onclick=()=>open('register');
$('sw').onclick=()=>open(mode==='login'?'register':'login');
$('auth-close').onclick=()=>$('auth').close();
$('auth-form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';
  try{const j=await api(mode,{id:$('id').value.trim(),pin:$('pin').value});L.setItem('hub-token',j.token);L.setItem('hub-id',j.id);$('pin').value='';$('auth').close();show();rank()}
  catch(e){$('msg').textContent=e.message}};
$('logout').onclick=()=>{L.removeItem('hub-token');L.removeItem('hub-id');show();rank()};
const esc=s=>s.replace(/[<&>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=(b,s)=>b==='pig'?'Day '+s:Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0');
let board=L.getItem('hub-board')||'jj-0';
async function rank(){
  document.querySelectorAll('#tabs button').forEach(t=>t.setAttribute('aria-pressed',t.dataset.b===board));
  $('unit').textContent=board==='pig'?'오래 버틴 날 수 순 · 상위 50명':'클리어 시간 빠른 순 · 상위 50명';
  const b=board;$('rank').innerHTML='';
  try{const{rows}=await api('rank&board='+b);if(b!==board)return;const me=L.getItem('hub-id');
    $('rank').innerHTML=rows.length?rows.map((r,i)=>`<tr class="${i<3?'top':''} ${r.id===me?'mine':''}"><td class="n">${i+1}</td><td class="who">${esc(r.id)}</td><td class="s">${fmt(b,r.score)}</td></tr>`).join(''):'<tr><td class="empty">아직 기록이 없습니다. 첫 기록의 주인이 되어 보세요.</td></tr>'}
  catch(e){$('rank').innerHTML='<tr><td class="empty"></td></tr>';$('rank').querySelector('td').textContent=e.message}}
$('tabs').onclick=e=>{const b=e.target.dataset?.b;if(!b)return;board=b;try{L.setItem('hub-board',b)}catch{}rank()};
show();rank();
try{if(!L.getItem('hub-token')&&!sessionStorage.getItem('hub-asked')){sessionStorage.setItem('hub-asked','1');open('login')}}catch{}
</script></main></body></html>
